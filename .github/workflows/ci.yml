name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v5

      # ── Node + pnpm setup ─────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # ── Install ────────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Generate Prisma client (needed for typecheck + build) ─────────────────
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      # ── Fix known pnpm/Node.js package resolution issue ────────────────────────
      - name: Fix fdir package.json in tinyglobby
        run: |
          NESTED_FDIR="node_modules/tinyglobby/node_modules/fdir"
          if [ -d "$NESTED_FDIR" ] && [ ! -f "$NESTED_FDIR/package.json" ]; then
            cp node_modules/fdir/package.json "$NESTED_FDIR/package.json"
          fi

      # ── Type check ────────────────────────────────────────────────────────────
      - name: TypeScript type check
        run: pnpm typecheck

      # ── Lint ──────────────────────────────────────────────────────────────────
      - name: Lint
        run: pnpm lint

      # ── Dependency vulnerability scan ────────────────────────────────────────
      # Security fix — CI trước đây không có bước nào quét lockfile, PR có thể
      # thêm/giữ dependency dính CVE mà không ai biết cho đến khi tự chạy tay.
      # --prod: chỉ quét dependency thực sự ship trong production build
      # (devDependencies như vitest/eslint/vite không lên server, ReDoS/arbitrary
      # file read của vite dev server không phải rủi ro thật ở đây — quét cả
      # --prod lẫn full sẽ đỏ liên tục vì các CVE dev-tooling chưa có bản vá,
      # vô hiệu hoá luôn giá trị cảnh báo của bước này). --audit-level=high:
      # chỉ chặn ở high/critical, moderate/low quá nhiều false-positive.
      - name: Dependency audit (production deps, high/critical)
        run: pnpm audit --prod --audit-level=high

      # ── Design tokens guard ───────────────────────────────────────────────────
      # Chặn PR thêm mới màu Tailwind mặc định (bg-blue-500...) thay vì dùng
      # token ink-* — xem scripts/check-design-tokens.js.
      - name: Design tokens check
        run: pnpm check:tokens

      # ── Unit + Integration tests ──────────────────────────────────────────────
      - name: Run tests
        run: pnpm test

      # ── Upload coverage report ────────────────────────────────────────────────
      - name: Generate coverage report
        run: pnpm test:coverage

      - name: Upload coverage to GitHub Actions summary
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      # ── Production build ──────────────────────────────────────────────────────
      - name: Build
        run: pnpm build
        env:
          # Provide dummy values so Next.js can perform a static build check.
          # Real secrets are managed by Vercel for CD.
          DATABASE_URL: postgresql://ci:ci@localhost/ci
          JWT_SECRET: ci-secret-placeholder
          FRONTEND_URL: http://localhost:3000
          YOUTUBE_API_KEY: placeholder
          MAILTRAP_HOST: sandbox.smtp.mailtrap.io
          MAILTRAP_PORT: 2525
          MAILTRAP_USER: placeholder
          MAILTRAP_PASS: placeholder
          MAIL_FROM: noreply@elearning.com

  # ── Docker image → GHCR (chỉ khi push lên main) ─────────────────────────────
  # Perf (2026-09-06): `next build` cần ~1.5–2GB RAM — build trên VPS 512MB/1GB
  # sẽ OOM. Build ở đây rồi VPS chỉ `docker pull ghcr.io/<owner>/<repo>:latest`.
  # Xem docs/DEPLOY.md mục "VPS tự host".
  docker-image:
    name: Build & push image
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
