# WP2.2 (revised) — LiteLLM proxy config: 1 endpoint, nhiều provider.
# Đổi provider chỉ cần thêm 1 entry ở đây + set env key tương ứng — không
# đụng code TS (LiteLLMProvider chỉ nói chuyện với endpoint OpenAI-compatible
# này). Model không cấu hình key thật vẫn liệt kê được, chỉ lỗi khi thực sự
# gọi tới (không chặn khởi động proxy).
model_list:
  # Groq — key thật đang có sẵn, dùng làm mặc định cho SHARED_FREE.
  # 2026-08-20: `llama-3.3-70b-versatile`/`llama-3.1-8b-instant` đã bị Groq
  # gỡ khỏi danh sách model (deprecated ngoài tầm kiểm soát của app) — đổi
  # sang `openai/gpt-oss-*` (model OSS Groq đang host thật, xác nhận qua
  # GET https://api.groq.com/openai/v1/models). Groq tự đổi danh mục model
  # theo thời gian — nếu lại gặp lỗi 404 model_not_found, kiểm tra lại danh
  # sách model đang có bằng chính URL trên rồi cập nhật 2 dòng model bên dưới,
  # không phải lỗi ở LiteLLMProvider/AIGenerationService.
  - model_name: default
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: groq-gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: groq-gpt-oss-20b
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY

  # OpenAI — bật khi có OPENAI_API_KEY.
  - model_name: openai-gpt4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # Anthropic — bật khi có ANTHROPIC_API_KEY.
  - model_name: anthropic-haiku
    litellm_params:
      model: anthropic/claude-3-5-haiku-20241022
      api_key: os.environ/ANTHROPIC_API_KEY

  # OpenRouter — 1 key, truy cập hàng trăm model; bật khi có OPENROUTER_API_KEY.
  - model_name: openrouter-llama
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct
      api_key: os.environ/OPENROUTER_API_KEY

  # Tự host (Ollama/vLLM/...) — trỏ base_url về endpoint OpenAI-compatible
  # của server tự host, không cần key thật (đa số self-host không yêu cầu).
  - model_name: selfhost
    litellm_params:
      model: openai/local-model
      api_base: os.environ/SELFHOST_LLM_BASE_URL
      api_key: os.environ/SELFHOST_LLM_API_KEY

litellm_settings:
  drop_params: true

# Không khai báo `general_settings.master_key` ở đây — làm vậy bật chế độ
# "virtual key" cần Postgres riêng cho proxy (lỗi "No connected db" nếu
# thiếu). Bearer-token check đơn giản đã đủ dùng qua biến môi trường
# LITELLM_MASTER_KEY (container nhận qua docker-compose.yml), không cần DB
# riêng cho proxy ở quy mô Checkpoint 2.
