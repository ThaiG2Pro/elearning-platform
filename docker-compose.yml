version: "3.9"

services:
  # ── PostgreSQL (local only) ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Perf (2026-09-06) — tuning cho VPS 1GB chạy chung app (docs/DEPLOY.md).
    mem_limit: 256m
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20
      - -c
      - work_mem=4MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elearning}
      POSTGRES_USER: ${POSTGRES_USER:-elearning_user}
      # Security fix — mật khẩu hardcode cứng (elearning_pass) trước đây là
      # default không đổi được, cùng 1 giá trị cho mọi máy chạy compose file
      # này. Giờ đọc từ .env (biến POSTGRES_PASSWORD), vẫn giữ default để
      # `docker compose up` chạy ngay không cần cấu hình cho dev cục bộ,
      # nhưng ai deploy thật (kể cả VPS 1GB ở docs/DEPLOY.md) phải tự set
      # POSTGRES_PASSWORD trong .env — xem .env.example.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elearning_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elearning_user -d elearning"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── LiteLLM proxy — TUỲ CHỌN (2026-09-06, quyết định nhóm E) ────────────
  # Trước là service bắt buộc; nay app gọi thẳng endpoint OpenAI-compatible
  # của provider (Groq mặc định) qua LITELLM_BASE_URL nên KHÔNG khởi động
  # cùng `docker compose up`. Proxy Python này ăn 300–500MB RAM — quá nặng
  # cho VPS 1GB. Chỉ bật khi máy ≥2GB và cần menu nhiều provider cho nhánh
  # SHARED_FREE:  docker compose --profile litellm up -d
  # rồi set LITELLM_BASE_URL=http://litellm:4000 cho app.
  # Nhánh BYOK chưa từng đi qua proxy này (user tự truyền endpoint riêng).
  litellm:
    profiles:
      - litellm
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      SELFHOST_LLM_BASE_URL: ${SELFHOST_LLM_BASE_URL}
      SELFHOST_LLM_API_KEY: ${SELFHOST_LLM_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}

  # ── Next.js Application ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    # Perf (2026-09-06) — trần RAM để 1 container lỗi không kéo cả VPS 1GB
    # sập; Node heap bên trong đã cap 384MB (Dockerfile NODE_OPTIONS).
    mem_limit: 512m
    ports:
      - "3000:3000"
    environment:
      # Security fix — user/password giờ khớp với đúng biến app đã set ở
      # service `db` (POSTGRES_USER/POSTGRES_PASSWORD) thay vì lặp lại
      # elearning_user/elearning_pass hardcode ở đây, tránh 2 nơi trôi lệch
      # nhau nếu ai đó chỉ đổi 1 chỗ. sslmode=disable giữ nguyên: `db` chỉ
      # nghe trên mạng nội bộ do compose tạo (không map ra ngoài ngoài port
      # debug 15432), Postgres image gốc cũng không có sẵn cert TLS để bật
      # sslmode=require — an toàn cho local/VPS 1 container, không áp dụng
      # cho DATABASE_URL production (Neon) vốn luôn dùng sslmode=require.
      DATABASE_URL: postgresql://${POSTGRES_USER:-elearning_user}:${POSTGRES_PASSWORD:-elearning_pass}@db:5432/${POSTGRES_DB:-elearning}?sslmode=disable&connection_limit=5&pool_timeout=10
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      MAILTRAP_HOST: ${MAILTRAP_HOST}
      MAILTRAP_PORT: ${MAILTRAP_PORT:-2525}
      MAILTRAP_USER: ${MAILTRAP_USER}
      MAILTRAP_PASS: ${MAILTRAP_PASS}
      MAIL_FROM: ${MAIL_FROM:-noreply@elearning.com}
      # Gọi thẳng provider (mặc định Groq). LITELLM_MASTER_KEY khi đó chính
      # là API key của provider. Xem .env.example.
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://api.groq.com/openai/v1}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-openai/gpt-oss-120b}
    depends_on:
      db:
        condition: service_healthy

  # ── DB migration runner (one-shot) ──────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    # Migrations only. Dev sample data is opt-in — run it yourself when you want it:
    #   docker compose run --rm migrate pnpm exec prisma db seed
    # (prisma/seed.ts TRUNCATEs every table and refuses to run against a non-local DB.)
    command: sh -c "pnpm exec prisma migrate deploy"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-elearning_user}:${POSTGRES_PASSWORD:-elearning_pass}@db:5432/${POSTGRES_DB:-elearning}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migrate

volumes:
  postgres_data:
