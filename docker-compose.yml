version: "3.9"

services:
  # ── PostgreSQL (local only) ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: elearning
      POSTGRES_USER: elearning_user
      POSTGRES_PASSWORD: elearning_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elearning_user -d elearning"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── LiteLLM proxy (WP2.2 revised) — 1 endpoint OpenAI-compatible cho nhiều
  # provider (Groq/OpenAI/Anthropic/OpenRouter/tự host). Đổi provider chỉ sửa
  # litellm/config.yaml + env key, không đụng code app.
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      SELFHOST_LLM_BASE_URL: ${SELFHOST_LLM_BASE_URL}
      SELFHOST_LLM_API_KEY: ${SELFHOST_LLM_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}

  # ── Next.js Application ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://elearning_user:elearning_pass@db:5432/elearning?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      MAILTRAP_HOST: ${MAILTRAP_HOST}
      MAILTRAP_PORT: ${MAILTRAP_PORT:-2525}
      MAILTRAP_USER: ${MAILTRAP_USER}
      MAILTRAP_PASS: ${MAILTRAP_PASS}
      MAIL_FROM: ${MAIL_FROM:-noreply@elearning.com}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-default}
    depends_on:
      db:
        condition: service_healthy
      litellm:
        condition: service_started

  # ── DB migration runner (one-shot) ──────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: sh -c "pnpm exec prisma migrate deploy && pnpm exec prisma db seed"
    environment:
      DATABASE_URL: postgresql://elearning_user:elearning_pass@db:5432/elearning?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migrate

volumes:
  postgres_data:
